name: CI

on:
  push:
  pull_request:

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  restore:
    name: restore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore PulseRisk.slnx --packages "$NUGET_PACKAGES"

  build:
    name: build
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PulseRisk.slnx --packages "$NUGET_PACKAGES"

      - name: Build
        run: dotnet build PulseRisk.slnx --configuration "$CONFIGURATION" --no-restore

  unit_tests:
    name: unit_tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PulseRisk.slnx --packages "$NUGET_PACKAGES"

      - name: Build
        run: dotnet build PulseRisk.slnx --configuration "$CONFIGURATION" --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/PulseRisk.UnitTests/PulseRisk.UnitTests.csproj
          --configuration "$CONFIGURATION"
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/test-results/unit/
          if-no-files-found: error
          retention-days: 7

  integration_tests:
    name: integration_tests
    runs-on: ubuntu-latest
    needs: build
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PulseRisk.slnx --packages "$NUGET_PACKAGES"

      - name: Build
        run: dotnet build PulseRisk.slnx --configuration "$CONFIGURATION" --no-restore

      - name: Docker info
        run: docker info

      - name: Pull PostgreSQL image
        run: docker pull postgres:17.4

      - name: Integration tests
        run: >
          dotnet test tests/PulseRisk.IntegrationTests/PulseRisk.IntegrationTests.csproj
          --configuration "$CONFIGURATION"
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/test-results/integration/
          if-no-files-found: error
          retention-days: 7

  static_analysis:
    name: static_analysis
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PulseRisk.slnx --packages "$NUGET_PACKAGES"

      - name: Static analysis
        run: dotnet format analyzers PulseRisk.slnx --verify-no-changes --verbosity minimal --no-restore

  docker_build:
    name: docker_build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Docker info
        run: docker info

      - name: Docker build
        run: docker build --pull -t "pulserisk-api:${GITHUB_SHA::12}" .
